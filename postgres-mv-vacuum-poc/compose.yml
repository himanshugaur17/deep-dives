services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: mv_vacuum_poc
      POSTGRES_USER: poc_user
      POSTGRES_PASSWORD: poc_password
    ports:
      - "55432:5432"
    command:
      - postgres
      - -c
      - track_io_timing=on
      - -c
      - log_autovacuum_min_duration=0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poc_user -d mv_vacuum_poc"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
