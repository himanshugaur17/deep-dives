version: '3.8'

services:
  postgres:
    image: postgres:latest
    container_name: seat-booking-postgres
    command: postgres -c max_connections=600 -c shared_buffers=256MB
    environment:
      POSTGRES_DB: seatbooking
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d seatbooking"]
      interval: 10s
      timeout: 5s
      retries: 5
